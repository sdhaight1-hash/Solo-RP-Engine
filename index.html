<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solo RP Engine</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Solo RP Engine</h1><p>Your stories, characters, and chance. Independent companion prototype.</p>
<section><h2>Campaign</h2><label>Campaign <select id="campaigns"></select></label><form id="new"><label>New campaign name <input id="name" required maxlength="200"></label><button>Create</button></form><button id="export">Export JSON</button><label>Import JSON <input id="import" type="file" accept=".json,application/json"></label></section>
<section><h2 id="title">Adventure</h2><form id="journal-form"><label>Journal entry <textarea id="entry" required></textarea></label><button>Add entry</button></form><ol id="journal"></ol></section>
<section><h2>Characters</h2><form id="character-form"><label>Name and notes <input id="character" required></label><button>Add character</button></form><ul id="characters"></ul></section>
<section><h2>Dice</h2><form id="dice-form"><label>Dice expression <input id="dice" value="1d10" required></label><button>Roll</button></form></section>
<section><h2>Custom oracle</h2><form id="oracle-form"><label>One equally likely result per line <textarea id="oracle" required>Yes
No
Uncertain</textarea></label><button>Draw result</button></form><p>These sample entries are generic; official rulebook tables are not bundled.</p></section>
<p id="status" role="status" aria-live="polite"></p></main><script type="module" src="src/app.js"></script></body></html>
