name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser acceptance checks
        run: |
          node server.mjs > /tmp/solo-rp-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000 > /dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-smoke.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: /tmp/solo-rp-*.png
          if-no-files-found: ignore
